name: Automerge

on:
  pull_request:
    types:
      - labeled
      - unlabeled
      - synchronize
      - opened
      - edited
      - ready_for_review
      - reopened
      - unlocked
  pull_request_review:
    types:
      - submitted
  check_suite:
    types:
      - completed
  status: {}
  check_suite:
    types: [completed]
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches: [18.0, main, master]

jobs:
  # Set repository variable PR_REVIEWER_USERNAME to the GitHub username for informatica@moval.es (Settings → Secrets and variables → Actions → Variables).
  add-reviewer:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Add informatica@moval.es as reviewer
        uses: actions/github-script@v7
        with:
          script: |
            const reviewer = '${{ vars.PR_REVIEWER_USERNAME }}';
            if (!reviewer) return;
            await github.rest.pulls.requestReviewers({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              reviewers: [reviewer],
            });

  # Merge when mergeable. When triggered by workflow_run, only run if Tests succeeded.
  # Do NOT use secrets.TOKEN: use github.token (or secrets.GITHUB_TOKEN). Token is auto-injected by GitHub.
  automerge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: automerge
        uses: pascalgn/automerge-action@v0.16.4
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
          MERGE_LABELS: "automerge,!work in progress,!wip"
          MERGE_METHOD: "merge"
          MERGE_FORKS: "false"
          MERGE_RETRIES: "6"
          MERGE_RETRY_SLEEP: "5000"
          MERGE_DELETE_BRANCH: "true"
