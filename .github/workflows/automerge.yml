name: Automerge

# status + check_suite: re-run when CI finishes so merge runs after all checks pass.
# Branch protection: require only status checks (Tests, Coverage). Do NOT require "Pull request reviews" or the bot cannot merge.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  status: {}
  check_suite:
    types: [completed]

jobs:
  # Set repository variable PR_REVIEWER_USERNAME to the GitHub username for informatica@moval.es (Settings → Secrets and variables → Actions → Variables).
  add-reviewer:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Add informatica@moval.es as reviewer
        uses: actions/github-script@v7
        with:
          script: |
            const reviewer = '${{ vars.PR_REVIEWER_USERNAME }}';
            if (!reviewer) return;
            await github.rest.pulls.requestReviewers({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              reviewers: [reviewer],
            });

  # Merge when mergeable (runs on pull_request and again on status/check_suite when CI finishes). No label required.
  # Branch protection must NOT require "Pull request reviews" or the bot cannot merge.
  automerge:
    runs-on: ubuntu-latest
    steps:
      - uses: pascalgn/automerge-action@v0.15.3
        env:
          TOKEN: ${{ secrets.TOKEN }}
          MERGE_LABELS: ""
          MERGE_METHOD: squash
