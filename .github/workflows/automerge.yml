name: Automerge

# status: re-runs when CI checks complete, so merge only happens after tests pass
on:
  pull_request:
    types: [opened, synchronize, reopened]
  status: {}

jobs:
  automerge:
    runs-on: ubuntu-latest
    steps:
      - uses: pascalgn/automerge-action@v0.15.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
