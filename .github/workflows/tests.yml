# Run Odoo 18.0 tests for addons in this repo (ter).
# Requires: PostgreSQL 15, Python 3.10, OCA/OCB 18.0, OCA queue_job.
name: Tests

on:
  push:
    branches: [18.0, main, master]
  pull_request:
    branches: [18.0, main, master]
  workflow_dispatch:

jobs:
  pre-commit:
    runs-on: ubuntu-22.04
    name: pre-commit
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install pre-commit and isort (local hook)
        run: pip install pre-commit isort

      - name: Run pre-commit
        run: pre-commit run --all-files

  test:
    runs-on: ubuntu-22.04
    name: Odoo 18 - addons ter

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL client and build deps for Python packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          sudo apt-get install -y -qq libldap2-dev libsasl2-dev

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p 5432 -U odoo 2>/dev/null; then
              echo "PostgreSQL is ready"
              exit 0
            fi
            echo "Waiting for PostgreSQL... $i/30"
            sleep 2
          done
          echo "PostgreSQL did not become ready in time"
          exit 1
        env:
          PGPASSWORD: odoo

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Clone OCA/OCB 18.0 (Odoo Community Backports)
        run: |
          git clone --depth 1 --branch 18.0 https://github.com/OCA/OCB.git ocb
          echo "ODOO_SRC=$PWD/ocb" >> $GITHUB_ENV

      - name: Clone OCA queue (queue_job dependency)
        run: |
          git clone --depth 1 --branch 18.0 https://github.com/OCA/queue.git oca_queue
          echo "OCA_QUEUE=$PWD/oca_queue" >> $GITHUB_ENV

      - name: Clone OCA server-ux (date_range dependency for base_ter)
        run: |
          git clone --depth 1 --branch 18.0 https://github.com/OCA/server-ux.git oca_server_ux
          echo "OCA_SERVER_UX=$PWD/oca_server_ux" >> $GITHUB_ENV

      - name: Clone extra addons (base_gen, base_gis, base_adi, base_report - optional)
        env:
          EXTRA_ADDONS_REPO: ${{ secrets.EXTRA_ADDONS_REPO }}
          EXTRA_ADDONS_BRANCH: ${{ secrets.EXTRA_ADDONS_BRANCH }}
        run: |
          if [ -n "$EXTRA_ADDONS_REPO" ]; then
            git clone --depth 1 --branch "${EXTRA_ADDONS_BRANCH:-18.0}" "$EXTRA_ADDONS_REPO" extra_addons
            echo "ADDONS_EXTRA=$GITHUB_WORKSPACE/extra_addons" >> $GITHUB_ENV
          fi

      - name: Install Odoo Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install --no-build-isolation cbor2==5.4.2 || pip install cbor2
          grep -v -E "^(cbor2|gevent|greenlet)==" $ODOO_SRC/requirements.txt | pip install -r /dev/stdin
          pip install gevent==21.8.0 greenlet==1.1.2

      - name: Install addon extra dependencies
        run: |
          pip install openpyxl paramiko pycryptodome coverage

      - name: Dependency security audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit --desc 2>&1 || true
        continue-on-error: true

      - name: Create Odoo config
        run: |
          ADDONS_PATH="$ODOO_SRC/addons,$OCA_QUEUE,$OCA_SERVER_UX,$GITHUB_WORKSPACE"
          [ -n "${ADDONS_EXTRA:-}" ] && ADDONS_PATH="$ADDONS_EXTRA,$ADDONS_PATH"
          cat > odoo.conf << EOF
          [options]
          addons_path = $ADDONS_PATH
          admin_passwd = admin
          db_host = 127.0.0.1
          db_port = 5432
          db_user = odoo
          db_password = odoo
          database = odoo_test
          EOF

      - name: Initialize database (base + queue_job)
        run: |
          python $ODOO_SRC/odoo-bin -c odoo.conf -i base,queue_job --stop-after-init --log-level=warn
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: odoo
          PGPASSWORD: odoo
        timeout-minutes: 15

      # base_ter also needs base_gen, base_gis, base_adi, base_report (set EXTRA_ADDONS_REPO secret to clone URL).
      - name: Run base_ter tests with coverage
        run: |
          coverage run --source=base_ter,base_ter_analytic,base_ter_general,l10n_es_territory,l10n_es_territory_sigpac,ter_analytic_geofolia \
            $ODOO_SRC/odoo-bin -c odoo.conf -i base_ter --test-enable --stop-after-init --log-level=test
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: odoo
          PGPASSWORD: odoo
        timeout-minutes: 20

      - name: Coverage report
        run: |
          coverage report -m
          coverage xml -o coverage.xml

      - name: Prepare coverage artifact
        run: tar czf coverage-artifacts.tar.gz .coverage coverage.xml

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-artifacts
          path: coverage-artifacts.tar.gz

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

  coverage-check:
    runs-on: ubuntu-22.04
    name: Coverage did not decrease
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        with:
          name: coverage-artifacts

      - name: Extract coverage files
        run: tar xzf coverage-artifacts.tar.gz

      - name: Check coverage did not decrease
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || github.ref_name }}
        run: |
          pip install coverage
          CURRENT=$(coverage report -m | tail -1 | awk '{gsub(/%/,""); print int($NF)}')
          BASE=0
          if git fetch -q origin "$BASE_REF" 2>/dev/null; then
            BASELINE=$(git show "origin/$BASE_REF:.coverage_baseline" 2>/dev/null || true)
          fi
          [ -n "$BASELINE" ] && BASE=$BASELINE
          echo "Coverage: current=$CURRENT% base=$BASE%"
          if [ "$CURRENT" -lt "$BASE" ]; then
            echo "Coverage decreased"
            exit 1
          fi

  quality:
    runs-on: ubuntu-22.04
    name: Code quality (pylint)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install pylint and pylint-odoo
        run: pip install pylint pylint-odoo

      - name: Run pylint on addons
        run: |
          for addon in base_ter base_ter_analytic base_ter_general l10n_es_territory l10n_es_territory_sigpac ter_analytic_geofolia; do
            [ -d "$addon" ] && pylint --load-plugins=pylint_odoo --output-format=text --exit-zero \
              "$addon/" --ignore="${addon}/migrations" 2>&1 | tail -50 || true
          done
        continue-on-error: true

  security-bandit:
    runs-on: ubuntu-22.04
    name: Security (bandit)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run bandit on addons
        run: |
          pip install bandit[toml]
          for addon in base_ter base_ter_analytic base_ter_general l10n_es_territory l10n_es_territory_sigpac ter_analytic_geofolia; do
            [ -d "$addon" ] && bandit -r "$addon" -x "${addon}/migrations" -f screen -ll 2>&1 | head -40 || true
          done
        continue-on-error: true

  link-check:
    runs-on: ubuntu-22.04
    name: Link check
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lychee link checker
        uses: lycheeverse/lychee-action@v1
        with:
          args: --verbose --no-progress ./.github/copilot-instructions.md ./README.rst ./base_ter/README.rst ./base_ter_analytic/README.rst ./base_ter_general/README.rst ./l10n_es_territory/README.rst ./l10n_es_territory_sigpac/README.rst ./ter_analytic_geofolia/README.rst
          fail: false
        continue-on-error: true

  codespell:
    runs-on: ubuntu-22.04
    name: Spell check (codespell)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run codespell
        run: |
          pip install codespell
          find base_ter base_ter_analytic base_ter_general l10n_es_territory l10n_es_territory_sigpac ter_analytic_geofolia -type f \( -name "*.py" -o -name "*.xml" -o -name "*.rst" -o -name "*.md" \) ! -path "*/migrations/*" -print0 2>/dev/null | xargs -0 codespell 2>&1 | head -60 || true
        continue-on-error: true

  xml-lint:
    runs-on: ubuntu-22.04
    name: XML lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate XML (xmllint)
        run: |
          echo "## XML validation" >> $GITHUB_STEP_SUMMARY
          FAIL=0
          for addon in base_ter base_ter_analytic base_ter_general l10n_es_territory l10n_es_territory_sigpac ter_analytic_geofolia; do
            [ -d "$addon" ] || continue
            while IFS= read -r -d '' f; do
              if ! xmllint --noout "$f" 2>&1; then FAIL=1; fi
            done < <(find "$addon" -name "*.xml" -print0)
          done
          [ "$FAIL" -eq 0 ] || exit 1
        continue-on-error: true

  complexity:
    runs-on: ubuntu-22.04
    name: Complexity (radon)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run radon (complexity and maintainability)
        run: |
          pip install radon
          echo "## Complexity (radon)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Maintainability (A=best)" >> $GITHUB_STEP_SUMMARY
          for addon in base_ter base_ter_analytic base_ter_general l10n_es_territory l10n_es_territory_sigpac ter_analytic_geofolia; do
            [ -d "$addon" ] && radon mi "$addon" -s --exclude "${addon}/migrations/*" 2>&1 | head -20 >> $GITHUB_STEP_SUMMARY || true
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Cyclomatic complexity (CC)" >> $GITHUB_STEP_SUMMARY
          for addon in base_ter base_ter_analytic base_ter_general l10n_es_territory l10n_es_territory_sigpac ter_analytic_geofolia; do
            [ -d "$addon" ] && radon cc "$addon" -s -a --exclude "${addon}/migrations/*" 2>&1 | head -30 >> $GITHUB_STEP_SUMMARY || true
          done
        continue-on-error: true

  stats:
    runs-on: ubuntu-22.04
    name: Repository stats
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Gather statistics
        run: |
          echo "## Repository statistics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          PY_LINES=$(find base_ter base_ter_analytic base_ter_general l10n_es_territory l10n_es_territory_sigpac ter_analytic_geofolia -name "*.py" -not -path "*/migrations/*" 2>/dev/null | xargs wc -l 2>/dev/null | tail -1 | awk '{print $1}' || echo "0")
          XML_LINES=$(find base_ter base_ter_analytic base_ter_general l10n_es_territory l10n_es_territory_sigpac ter_analytic_geofolia -name "*.xml" 2>/dev/null | xargs wc -l 2>/dev/null | tail -1 | awk '{print $1}' || echo "0")
          TEST_COUNT=$(grep -r "def test_" base_ter base_ter_analytic base_ter_general l10n_es_territory l10n_es_territory_sigpac ter_analytic_geofolia --include="*.py" 2>/dev/null | wc -l || echo "0")
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Python lines (excl. migrations) | ${PY_LINES:-0} |" >> $GITHUB_STEP_SUMMARY
          echo "| XML lines | ${XML_LINES:-0} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test methods | ${TEST_COUNT:-0} |" >> $GITHUB_STEP_SUMMARY

  # Optional: send email when the workflow fails. Requires repo secrets:
  #   MAIL_SMTP_SERVER, MAIL_USERNAME, MAIL_PASSWORD, MAIL_TO, MAIL_FROM
  # (If secrets are not set, this job is skipped; set at least one to enable.)
  notify-on-failure:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: [pre-commit, test, coverage-check]
    if: failure() && (needs.pre-commit.result == 'failure' || needs.test.result == 'failure' || needs.coverage-check.result == 'failure')
    steps:
      - name: Send failure email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SMTP_SERVER }}
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "[GitHub] Tests failed - ${{ github.repository }} (${{ github.ref_name }})"
          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.MAIL_FROM }}
          body: |
            Workflow run failed.
            Repository: ${{ github.repository }}
            Branch/Ref: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Triggered by: ${{ github.actor }}
        continue-on-error: true
